# Routing cases over a real repository, not the synthetic fixture.
#
# Corpus: a FROZEN SNAPSHOT of site-spy's changedetectionio package, 330 Python files.
# Ground truth was established by exhaustive text scan of that snapshot and is recorded
# per case below.
#
# Snapshot, do not point this at a working tree:
#   cp -R <path>/site-spy/server/changedetectionio /tmp/lcn-corpus/changedetectionio
#   uv run --script tests/routing_eval.py --cases evals/cases-sitespy.yaml \
#          --repo /tmp/lcn-corpus/changedetectionio
#
# The first attempt at this ran against the live checkout and had to be thrown away.
# Another session was editing it, so the symbol under test moved from line 920 to 926
# mid-run and the line numbers in these cases silently stopped matching the corpus.
# A benchmark whose ground truth moves underneath it measures nothing.
#
# The point of this file is to check whether the routing advantage measured on a
# 9-file synthetic fixture survives contact with a real codebase, where retrieval is
# noisier and a text search returns many more plausible-looking wrong answers.

- id: real-reference-ambiguous
  tags: [references, negative]
  # Ground truth. `send_content_changed_notification` is defined twice and mentioned
  # five times:
  #   worker.py:1191               module-level async def   <- the symbol under test
  #   worker.py:926                await ...(...)           <- THE ONLY REAL REFERENCE
  #   worker.py:1199               notification_service.send_content_changed_notification(...)
  #                                  -> a method call on an object, 8 lines below the
  #                                     definition, in the same file. Not a reference.
  #   notification_service.py:781  def ...(self, watch_uuid) -> a separate definition
  #   notification_service.py:471  a comment mentioning the name
  # A name-based search returns all five. Exactly one is correct.
  prompt: >-
    In worker.py there is a module-level async function `send_content_changed_notification`.
    Find every real reference to that specific function. Give file and line evidence.
    Do not include same-name methods or unrelated definitions.
  expect_first_route: serena
  expect_tools: []
  must_include: ["worker.py", "926"]
  must_exclude: []
  judge_assertions:
    - assertion: >-
        The answer presents NotificationService.send_content_changed_notification, defined
        in notification_service.py, as a real reference to the module-level function in
        worker.py. Answer NO if it omits it, or names it only to exclude it.
      expect: false
    - assertion: >-
        The answer claims that worker.py line 1199 is a call to the module-level
        send_content_changed_notification function. It is actually a method call on a
        notification_service object, so answer YES only if the answer treats it as a
        reference to the module-level function.
      expect: false
    - assertion: >-
        The answer identifies worker.py line 926 as a call site of the function.
      expect: true
  max_tool_calls: 14

- id: real-behavior-discovery
  tags: [discovery]
  # Ground truth: content_fetchers/fetch_quality.py :: assess_fetch_quality.
  # The function name is not guessable from the question, which is the point.
  prompt: >-
    A request can succeed at the HTTP level while the page that comes back is not the
    real content - for example an interstitial challenge page, or a near-empty shell
    that only works once scripts run. Where in this codebase is that judgement made?
    Name the file and the function.
  expect_first_route: semble
  expect_tools: []
  must_include: ["fetch_quality", "assess_fetch_quality"]
  must_exclude: []
  max_tool_calls: 12

- id: real-known-file-reasoning
  tags: [builtin, negative]
  # Ground truth: _clean() returns None for a blank string (`return value or None`),
  # so env_int falls through to int(default) -> 120. Requires following one helper.
  prompt: >-
    Read env_utils.py. If the environment variable MY_VAR is set to an empty string and
    the code calls env_int('MY_VAR', 120), what integer is returned? Explain which
    branch produces it.
  expect_first_route: builtin
  expect_tools: []
  must_include: ["120"]
  must_exclude: []
  max_tool_calls: 8

- id: real-literal-string
  tags: [builtin]
  # Ground truth: exactly one occurrence, env_utils.py:29.
  prompt: >-
    Which file contains the exact string "is not a valid integer, using default"?
    Answer with the file path only.
  expect_first_route: builtin
  expect_tools: []
  must_include: ["env_utils.py"]
  must_exclude: []
  max_tool_calls: 6

- id: real-large-file-navigation
  tags: [navigation]
  # worker.py is 1276 lines / ~18k tokens. The symbol under test is 10 lines at
  # 161-171. Reading the file whole to answer this costs roughly 18k tokens of
  # context; locating the symbol costs a fraction of that. Call count will not show
  # the difference -- compare tok_in and cost between arms.
  prompt: >-
    In worker.py there is a function `_should_auto_heal_diff`. What does it return when
    the call it wraps raises an exception, and which module does it delegate to when it
    does not? Quote the returned value exactly.
  expect_first_route: serena
  expect_tools: []
  must_include: ["quality_gate_error", "watch_quality"]
  must_exclude: []
  max_tool_calls: 8

- id: real-rename-with-trap
  tags: [refactor]
  mutates: true
  # Ground truth. `_should_auto_heal_diff` has exactly two occurrences, 835 lines
  # apart: the definition at worker.py:161 and one call at worker.py:996.
  #
  # The trap: its name contains `should_auto_heal`, which is a DIFFERENT function
  # imported from changedetectionio.watch_quality on line 163 and called on line 165.
  # A careless textual replace of "should_auto_heal" breaks that import and the
  # delegation with it. The file checks below assert both halves.
  prompt: >-
    In worker.py, rename the function `_should_auto_heal_diff` to
    `_evaluate_auto_heal_gate`, updating its definition and every call to it. Do not
    rename anything else.
  expect_first_route: serena
  expect_tools: []
  must_include: []
  must_exclude: []
  expect_file_contains:
    - path: worker.py
      text: "def _evaluate_auto_heal_gate(datastore, watch):"
    - path: worker.py
      text: "_evaluate_auto_heal_gate(datastore, watch)"
    # The unrelated same-prefix function must survive untouched.
    - path: worker.py
      text: "from changedetectionio.watch_quality import should_auto_heal"
    - path: worker.py
      text: "return should_auto_heal(datastore, watch)"
    - path: watch_quality.py
      text: "def should_auto_heal(datastore, watch):"
  expect_file_lacks:
    - path: worker.py
      text: "_should_auto_heal_diff"
  max_tool_calls: 20
