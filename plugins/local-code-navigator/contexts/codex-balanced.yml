description: Balanced symbolic navigation for Codex
prompt: |
  You are running in Codex, which already provides file reading, literal search,
  file discovery, shell, and small line-based editing tools.

  Use Serena for questions that require code intelligence: symbol overviews and bodies,
  declarations, implementations, real references, diagnostics, symbol renames, and
  whole-symbol edits. Use Codex's built-in tools for literal text search, file
  discovery, reading and reasoning about a known file, and small inline changes.

  Choose the narrowest tool that matches the question. A name-based text search is not
  a semantic reference check. For architecture tracing, semantic discovery may identify
  likely endpoints, but Serena references should confirm the actual relationships.

excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - find_file
  - list_dir
  - search_for_pattern

tool_description_overrides: {}

# Codex does not pin a project at startup (cwd is the plugin root, so
# --project-from-cwd would detect the wrong directory). Leave project switching
# enabled so the skill can activate the user's repository once per session.
single_project: false

# Unlike the Claude context, structured output is left at auto-detect: the escaping
# bug that forces it off for Claude Code is specific to that client.
structured_tool_output: null
